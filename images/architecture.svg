<title id="t">EH3D-SUITE-LAUNCHER architecture</title>
<desc id="d">EH3D-SUITE-LAUNCHER is a Rust library and command line that read the manifests of the repositories of the suite, start their programs (again when they fail) and keep the list of recent projects and the project file. Built with the gui feature it also has a window (egui) with the recent projects, the files of the open project, the programs of the suite and a button to start each one.</desc>
