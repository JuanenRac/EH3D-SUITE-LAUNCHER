name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The checks every repository of the suite runs, held once in EH3D-DOCS as a reusable workflow
  # (the manifest, the documents, the pictures of the README). The reference is a full commit, so
  # a change there reaches this repository only when this line is moved.
  validate:
    uses: JuanenRac/EH3D-DOCS/.github/workflows/validate.yml@9a81ff1df03801c80300e57bb66a707c0c756f19
    with:
      python-version: "3.12"
      check-pictures: true

  changelog:
    name: The change has a line in the CHANGELOG
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -I tools/changelog_pr_check.py --base origin/${{ github.base_ref }}
